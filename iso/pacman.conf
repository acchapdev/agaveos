#
# pacman.conf for building the Agave Linux ISO.
# Same as stock Arch plus the [agaveos] custom repo.
#
[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5

# Official packages require valid signatures; [agaveos] is signed by our own
# key (agave-keyring). During unsigned local iteration the build script may
# relax this — see scripts/build-iso.sh.
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

# Agave Linux custom repository. During the ISO build this is populated from
# the local repo/ directory (build-iso.sh rewrites the Server line); on the
# installed system agave-release ships the GitHub-Release mirrorlist.
[agaveos]
SigLevel = Optional TrustAll
Server = file:///work/repo
