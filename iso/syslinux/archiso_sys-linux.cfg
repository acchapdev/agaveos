LABEL agave
TEXT HELP
Boot Agave Linux (default kernel) and launch the installer.
ENDTEXT
MENU LABEL Agave Linux (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

LABEL agave-lts
TEXT HELP
Boot Agave Linux using the long-term-support (LTS) kernel.
ENDTEXT
MENU LABEL Agave Linux, ^LTS kernel (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

LABEL agave-safe
TEXT HELP
Boot Agave Linux with software rendering for problematic GPUs.
Disables kernel mode setting and runs the compositor on the CPU.
ENDTEXT
MENU LABEL Agave Linux (^safe graphics) (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset agave.safegraphics=1
