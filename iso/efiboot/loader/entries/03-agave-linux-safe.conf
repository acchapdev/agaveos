title    Agave Linux (safe graphics) (%ARCH%, UEFI)
sort-key 03
linux    /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
initrd   /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
# Force software rendering for GPUs that fail to bring up KMS: disable kernel
# mode setting and steer Mesa/Wayland to the llvmpipe software renderer.
# WLR_RENDERER=pixman keeps wlroots (Mango) off the GPU entirely.
options  archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% nomodeset agave.safegraphics=1
