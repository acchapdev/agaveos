# Calamares settings for Agave Linux (docs/PLAN.md Phase 2).
# Offline unpackfs install of the live desktop, btrfs @ @home @log @pkg
# subvolumes, GRUB, then a cleanup job that strips the live-only bits.
---
modules-search: [ local ]

instances:
    - id: mkinitcpio
      module: shellprocess
      config: shellprocess_mkinitcpio.conf
    - id: snapper
      module: shellprocess
      config: shellprocess_snapper.conf
    - id: cleanup
      module: shellprocess
      config: shellprocess_cleanup.conf

sequence:
    - show:
          - welcome
          - locale
          - keyboard
          - partition
          - users
          - summary
    - exec:
          - partition
          - mount
          - unpackfs
          - machineid
          - fstab
          - locale
          - keyboard
          - localecfg
          - users
          - networkcfg
          - hwclock
          # restore stock mkinitcpio presets (drop the live archiso preset)
          # before regenerating the initramfs.
          - shellprocess@mkinitcpio
          - initcpiocfg
          - initcpio
          - grubcfg
          - bootloader
          # snapper + snap-pac + grub-btrfs on the target, then strip the
          # live user / autologin / installer artifacts (Phase 4 adds nvidia).
          # packages (which removes calamares AND agave-calamares-config — the
          # package shipping these scripts) must run AFTER the shellprocess
          # jobs, or they fail with exit 127 (script deleted from the target).
          - shellprocess@snapper
          - shellprocess@cleanup
          - packages
          - umount
    - show:
          - finished

branding: agave

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
