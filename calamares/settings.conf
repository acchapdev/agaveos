# Calamares settings for Agave Linux.
# Skeleton per docs/PLAN.md Phase 2 — module configs land in modules/ and
# branding in branding/agave/ as that phase is implemented.
---
modules-search: [ local ]

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - networkcfg
      - hwclock
      - grubcfg
      - bootloader
      # snapper + snap-pac setup, nvidia detect-enable, live-artifact cleanup
      - shellprocess@snapper
      - shellprocess@nvidia
      - shellprocess@cleanup
      - umount
  - show:
      - finished

branding: agave

prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
