# Offline install: copy the live squashfs (the running desktop) to the target.
# "what you boot is what you get" (docs/PLAN.md). The Calamares cleanup job
# later strips the live-only bits from the installed system.
---
unpack:
    - source: "/run/archiso/bootmnt/agave/x86_64/airootfs.sfs"
      sourcefs: "squashfs"
      destination: ""
