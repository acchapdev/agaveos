# /etc/default/grub for the installed system. Keep the submenu enabled so
# grub-btrfs can add its snapshot boot submenu (docs/PLAN.md Phase 3).
#
# always_use_defaults MUST stay true. The `defaults` block below is only
# applied when `always_use_defaults or overwrite or not os.path.exists(
# /etc/default/grub)` (grubcfg/main.py), and the grub package always ships
# /etc/default/grub — so with this false every key here was silently dropped
# and the target kept stock Arch's values (notably GRUB_DEFAULT=0). Only
# GRUB_CMDLINE_LINUX_DEFAULT and GRUB_DISTRIBUTOR are written unconditionally.
# Calamares still merges into the existing file rather than clobbering it
# (update_existing_config replaces matching keys, even commented-out ones,
# and appends the rest), so overwrite stays false.
---
overwrite: false
prefer_grub_d: false
keep_distributor: false
kernel_params: [ "quiet" ]
defaults:
    GRUB_TIMEOUT: 5
    GRUB_DEFAULT: "saved"
    GRUB_DISABLE_SUBMENU: false
    GRUB_TERMINAL_OUTPUT: "console"
    GRUB_DISABLE_RECOVERY: true
    # PLAN.md 3.2 wants `linux` to be the default kernel. 10_linux builds the
    # top-level entry from a REVERSE version sort, which puts linux-zen first;
    # GRUB_TOP_LEVEL moves the named image back to the front.
    GRUB_TOP_LEVEL: "/boot/vmlinuz-linux"
always_use_defaults: true
