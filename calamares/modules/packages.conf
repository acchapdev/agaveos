# Remove installer + live-only packages from the target after unpackfs.
# The desktop stack stays; only Calamares itself and live-session helpers go.
# (The cleanup shellprocess job handles config/user/service removal.)
---
backend: pacman
skip_if_no_internet: false
update_db: false
update_system: false

pacman:
    num_retries: 3
    disable_download_timeout: true
    needed_only: false

operations:
    - remove:
        - calamares
        - agave-calamares-config
