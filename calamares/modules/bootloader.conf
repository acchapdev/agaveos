# GRUB on the installed system (UEFI and BIOS), per docs/PLAN.md. grub-btrfs
# (snapshot boot submenu) is wired up by the shellprocess@snapper job.
---
efiBootLoader: "grub"
kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"
kernelParams: [ "quiet" ]

grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"

# Name shown in the UEFI boot menu / GRUB distributor.
efiBootloaderId: "Agave Linux"

installEFIFallback: true
