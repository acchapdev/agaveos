# Strip live-only artifacts and configure the installed system. Runs in the
# target chroot; the script ships with agave-calamares-config at
# /usr/share/agave/calamares/agave-cleanup. ${USER} is the created username.
---
dontChroot: false
timeout: 120
verbose: true
script:
    - "/usr/share/agave/calamares/agave-cleanup ${USER}"
