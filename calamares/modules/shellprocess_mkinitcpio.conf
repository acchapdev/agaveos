# Restore stock mkinitcpio presets on the target before the initcpio job runs
# (the live ISO's archiso presets are unusable on an installed system). Runs in
# the target chroot; the script ships in agave-calamares-config.
---
dontChroot: false
timeout: 60
verbose: true
script:
    - "/usr/share/agave/calamares/agave-mkinitcpio-presets"
