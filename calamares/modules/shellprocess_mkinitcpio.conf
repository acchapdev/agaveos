# Prepare the target's /boot (copy kernel images from the live medium — archiso
# strips them from the squashfs) and write stock mkinitcpio presets, before the
# initcpio job regenerates the initramfs. Runs on the LIVE system (not chroot)
# because it reads /run/archiso/bootmnt; ${ROOT} is the target mount.
# Script ships in agave-calamares-config.
---
dontChroot: true
timeout: 120
verbose: true
script:
    - "/usr/share/agave/calamares/agave-mkinitcpio-presets ${ROOT}"
