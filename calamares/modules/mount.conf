# btrfs subvolume layout for Agave Linux: @ @home @log @pkg (per docs/PLAN.md).
# @log and @pkg are separate subvolumes so system logs and the pacman package
# cache stay out of / snapshots (snapper/snap-pac snapshot @ only).
---
setSELinux: false

extraMounts:
    - device: proc
      fs: proc
      mountPoint: /proc
    - device: sys
      fs: sysfs
      mountPoint: /sys
    - device: /dev
      mountPoint: /dev
      options: [ bind ]
    - device: tmpfs
      fs: tmpfs
      mountPoint: /run
    - device: /run/udev
      mountPoint: /run/udev
      options: [ bind ]
    - device: efivarfs
      fs: efivarfs
      mountPoint: /sys/firmware/efi/efivars
      efi: true

btrfsSubvolumes:
    - mountPoint: /
      subvolume: /@
    - mountPoint: /home
      subvolume: /@home
    - mountPoint: /var/log
      subvolume: /@log
    - mountPoint: /var/cache/pacman/pkg
      subvolume: /@pkg

mountOptions:
    - filesystem: default
      options: [ noatime ]
    - filesystem: efi
      options: [ fmask=0137, dmask=0027 ]
    - filesystem: btrfs
      options: [ noatime, compress=zstd:1, space_cache=v2 ]
