# User account creation for Agave Linux. The created user joins wheel (sudo)
# and the desktop groups. greetd autologin for the installed system is set up
# by the cleanup shellprocess job (which also removes the live `agave` user).
---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - lp
    - video
    - audio
    - network
    - storage
    - power
    - input
    - name: wheel
      must_exist: false
      system: true

sudoersGroup: wheel
sudoersConfigureWithGroup: true

setRootPassword: false
doReusePassword: true

doAutologin: false
displayAutologin: false

passwordRequirements:
    minLength: 1
    maxLength: -1

allowWeakPasswords: true
allowWeakPasswordsDefault: false
