# Agave Linux partitioning. btrfs by default with the @ @home @log @pkg
# subvolume layout (see mount.conf for the subvolume definitions), an EFI
# system partition, and optional LUKS. Erase-disk and manual modes.
---
efi:
    mountPoint:         "/efi"
    recommendedSize:    1024MiB
    minimumSize:        512MiB
    label:              "AGAVE_EFI"

userSwapChoices:
    - none      # zram-generator provides swap on the installed system
    - small
    - suspend
    - file

drawNestedPartitions:      false
alwaysShowPartitionLabels: true
initialPartitioningChoice: none
initialSwapChoice:         none

# btrfs is the Agave default; ext4 offered as an alternative on erase.
defaultFileSystemType:    "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]

# LUKS as a simple checkbox (luks2). Secure Boot is out of scope for v1.
luksGeneration: luks2
showNotEncryptedBootMessage: false

# Allow erase, manual, and (if space) alongside/replace.
allowManualPartitioning: true
