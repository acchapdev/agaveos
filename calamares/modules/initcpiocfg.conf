# Regenerate the installed system's mkinitcpio.conf. The module REPLACES the
# hook list wholesale (it does not edit the shipped one), so this file decides
# which init system the initramfs uses.
#
# useSystemdHook: true selects the systemd hook stack (systemd + sd-vconsole),
# matching the mkinitcpio.conf shipped on the ISO, and — critically — makes
# Calamares add `sd-encrypt` rather than the classic `encrypt` hook on LUKS
# installs (see initcpiocfg/main.py: encrypt_hook -> sd-encrypt iff use_systemd).
# The classic `encrypt` hook does not work alongside the systemd stack; with
# this false, an encrypted install produces an unbootable initramfs.
#
# The flag only takes effect if `systemd-cat` exists in the target; it does
# (shipped by systemd in the squashfs), as do the sd-encrypt/sd-vconsole hooks.
---
useSystemdHook: true
hooks:
    prepend: []
    append: []
    remove: [ "archiso", "archiso_loop_mnt", "memdisk" ]
source: "/etc/mkinitcpio.conf"
