# Regenerate the installed system's mkinitcpio.conf. The live archiso hooks
# (archiso, archiso_loop_mnt) are removed and standard disk hooks used; the
# encrypt hook is added by Calamares automatically when LUKS is selected.
---
useSystemdHook: false
hooks:
    prepend: []
    append: []
    remove: [ "archiso", "archiso_loop_mnt", "memdisk" ]
source: "/etc/mkinitcpio.conf"
